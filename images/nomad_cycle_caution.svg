<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="10" y="28" font-size="20" font-weight="bold" fill="#111">Nomad – Cycle de vie d'une caution (pattern State)</text>
  <text x="10" y="50" font-size="13" fill="#444">Les quatre états viennent du dossier ; les conditions écrites sur les flèches sont mes hypothèses, à valider avec le fondateur.</text>

  <!-- Départ -->
  <circle cx="40" cy="215" r="9" fill="#111"/>
  <line x1="49" y1="215" x2="98" y2="215" stroke="#111" stroke-width="2" marker-end="url(#fl)"/>
  <text x="30" y="250" font-size="11" fill="#111">location</text>
  <text x="30" y="264" font-size="11" fill="#111">confirmée</text>

  <!-- États -->
  <g font-size="15" font-weight="bold" fill="#111" text-anchor="middle">
    <rect x="100" y="180" width="180" height="70" rx="30" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
    <text x="190" y="211">Bloquée</text>
    <text x="190" y="231" font-size="11" font-weight="normal">empreinte posée</text>

    <rect x="370" y="380" width="180" height="70" rx="30" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="460" y="411">En litige</text>
    <text x="460" y="431" font-size="11" font-weight="normal">Nomad doit trancher</text>

    <rect x="650" y="70" width="190" height="70" rx="30" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
    <rect x="655" y="75" width="180" height="60" rx="26" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="745" y="101">Libérée</text>
    <text x="745" y="121" font-size="11" font-weight="normal">rien n'est débité</text>

    <rect x="650" y="230" width="190" height="70" rx="30" fill="#eef2f8" stroke="#2b4c7e" stroke-width="2"/>
    <rect x="655" y="235" width="180" height="60" rx="26" fill="none" stroke="#2b4c7e" stroke-width="1.5"/>
    <text x="745" y="261">Retenue</text>
    <text x="745" y="281" font-size="11" font-weight="normal">montant du dommage débité</text>
  </g>

  <!-- Transitions -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="280" y1="195" x2="648" y2="110" marker-end="url(#fl)"/>
    <line x1="280" y1="225" x2="648" y2="262" marker-end="url(#fl)"/>
    <line x1="230" y1="250" x2="390" y2="380" marker-end="url(#fl)"/>
    <line x1="530" y1="385" x2="690" y2="302" marker-end="url(#fl)"/>
    <polyline points="550,430 870,430 870,105 842,105" marker-end="url(#fl)"/>
  </g>
  <g font-size="12" fill="#111">
    <text x="455" y="138" text-anchor="middle" transform="rotate(-13 455 138)">① retour sans dommage nouveau</text>
    <text x="465" y="232" text-anchor="middle" transform="rotate(5.7 465 232)">② dommage constaté, accepté par le locataire</text>
    <text x="312" y="330" text-anchor="end">③ dommage contesté</text>
    <text x="312" y="346" text-anchor="end">par le locataire</text>
    <text x="625" y="368">④ décision de Nomad :</text>
    <text x="625" y="384">dommage confirmé</text>
    <text x="710" y="450" text-anchor="middle">⑤ décision de Nomad : dommage non prouvé</text>
  </g>

  <!-- Légende -->
  <rect x="10" y="470" width="880" height="82" rx="6" fill="#fafafa" stroke="#bbb"/>
  <g font-size="12" fill="#111">
    <text x="20" y="490" font-weight="bold">Légende</text>
    <text x="20" y="508">Cadre arrondi = un état de la caution ; double bordure = état final, dont on ne sort plus ; flèche = transition autorisée, avec sa condition.</text>
    <text x="20" y="526">Toute transition absente du schéma est refusée par la caution elle-même, par exemple « Libérée → Retenue » ou « Retenue → En litige ».</text>
    <text x="20" y="544">🤔 Une empreinte bancaire expire après un délai fixé par la banque : ce cas, absent du dossier, est à vérifier avec le prestataire de paiement.</text>
  </g>
</svg>
