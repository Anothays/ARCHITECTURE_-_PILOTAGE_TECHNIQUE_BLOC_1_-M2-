<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7b34"/>
    </marker>
    <marker id="ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111">Théo – Cycle de vie d'une commande (pattern State)</text>

  <!-- Départ -->
  <circle cx="450" cy="62" r="9" fill="#111"/>
  <text x="466" y="58" font-size="12" fill="#333">la commande est validée</text>
  <path d="M442,68 L170,128" stroke="#1e7b34" stroke-width="2" fill="none" marker-end="url(#ok)"/>
  <text x="170" y="92" font-size="12" fill="#1e7b34">le client choisit le virement</text>
  <path d="M450,71 L450,128" stroke="#1e7b34" stroke-width="2" fill="none" marker-end="url(#ok)"/>
  <text x="458" y="108" font-size="12" fill="#1e7b34">carte, PayPal ou Apple Pay accepté</text>

  <!-- États ligne 1 -->
  <g font-size="14">
    <rect x="40" y="130" width="230" height="56" rx="10" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="155" y="154" text-anchor="middle" font-weight="bold">En attente de paiement</text>
    <text x="155" y="173" text-anchor="middle" font-size="12" fill="#555">(virement) – Déduite</text>

    <rect x="340" y="130" width="220" height="56" rx="10" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="450" y="154" text-anchor="middle" font-weight="bold">Payée</text>
    <text x="450" y="173" text-anchor="middle" font-size="12" fill="#555">« payee » – Dossier</text>

    <rect x="640" y="130" width="230" height="56" rx="10" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="755" y="154" text-anchor="middle" font-weight="bold">Expédiée</text>
    <text x="755" y="173" text-anchor="middle" font-size="12" fill="#555">« expediee » – Dossier</text>
  </g>

  <!-- Transitions ligne 1 -->
  <line x1="270" y1="158" x2="338" y2="158" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="304" y="208" text-anchor="middle" font-size="12" fill="#1e7b34">virement reçu,</text>
  <text x="304" y="222" text-anchor="middle" font-size="12" fill="#1e7b34">constaté par la compta</text>
  <line x1="560" y1="158" x2="638" y2="158" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="600" y="208" text-anchor="middle" font-size="12" fill="#1e7b34">expédier</text>

  <!-- États ligne 2 -->
  <g font-size="14">
    <rect x="40" y="330" width="230" height="56" rx="10" fill="#f6f6f6" stroke="#1f3a5f" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="155" y="354" text-anchor="middle" font-weight="bold">Annulée</text>
    <text x="155" y="373" text-anchor="middle" font-size="12" fill="#555">état final – 🤔</text>

    <rect x="340" y="330" width="220" height="56" rx="10" fill="#f6f6f6" stroke="#1f3a5f" stroke-width="3"/>
    <text x="450" y="354" text-anchor="middle" font-weight="bold">Remboursée</text>
    <text x="450" y="373" text-anchor="middle" font-size="12" fill="#555">état final – Dossier</text>

    <rect x="640" y="330" width="230" height="56" rx="10" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="755" y="354" text-anchor="middle" font-weight="bold">Livrée</text>
    <text x="755" y="373" text-anchor="middle" font-size="12" fill="#555">🤔</text>

    <rect x="640" y="480" width="230" height="56" rx="10" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="755" y="504" text-anchor="middle" font-weight="bold">Retour reçu</text>
    <text x="755" y="523" text-anchor="middle" font-size="12" fill="#555">🤔 colis revenu à l'entrepôt</text>
  </g>

  <!-- Transitions verticales -->
  <line x1="120" y1="186" x2="120" y2="328" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="128" y="255" font-size="12" fill="#1e7b34">virement non reçu</text>
  <text x="128" y="270" font-size="12" fill="#1e7b34">dans le délai 🤔</text>

  <line x1="400" y1="186" x2="400" y2="328" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="392" y="255" font-size="12" fill="#1e7b34" text-anchor="end">rembourser avant</text>
  <text x="392" y="270" font-size="12" fill="#1e7b34" text-anchor="end">l'expédition</text>

  <line x1="800" y1="186" x2="800" y2="328" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="808" y="255" font-size="12" fill="#1e7b34">livraison</text>
  <text x="808" y="270" font-size="12" fill="#1e7b34">confirmée 🤔</text>

  <line x1="800" y1="386" x2="800" y2="478" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="808" y="430" font-size="12" fill="#1e7b34">le client renvoie</text>
  <text x="808" y="445" font-size="12" fill="#1e7b34">le colis 🤔</text>

  <path d="M640,508 L480,508 L480,388" stroke="#1e7b34" stroke-width="2" fill="none" marker-end="url(#ok)"/>
  <text x="560" y="528" text-anchor="middle" font-size="12" fill="#1e7b34">rembourser après le retour</text>

  <!-- Transition interdite : Expédiée -> Remboursée -->
  <path d="M680,186 L540,328" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ko)"/>
  <rect x="566" y="236" width="140" height="44" fill="#ffffff" stroke="#c0392b"/>
  <text x="636" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">INTERDIT</text>
  <text x="636" y="271" text-anchor="middle" font-size="11" fill="#c0392b">rembourserCommande()</text>


  <!-- Légende -->
  <rect x="20" y="565" width="860" height="125" rx="6" fill="#fafafa" stroke="#999"/>
  <text x="35" y="587" font-size="13" font-weight="bold" fill="#111">Légende</text>
  <line x1="35" y1="605" x2="85" y2="605" stroke="#1e7b34" stroke-width="2" marker-end="url(#ok)"/>
  <text x="95" y="609" font-size="12" fill="#111">transition autorisée, écrite une seule fois dans la classe Commande ; toute transition absente du schéma est refusée.</text>
  <line x1="35" y1="627" x2="85" y2="627" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ko)"/>
  <text x="95" y="631" font-size="12" fill="#111">exemple de transition refusée : le bug actuel « remboursée alors qu'expédiée ». « Expédier » depuis « En attente » est refusé de la même façon.</text>
  <rect x="35" y="641" width="50" height="16" rx="4" fill="#f6f6f6" stroke="#1f3a5f" stroke-width="3"/>
  <text x="95" y="654" font-size="12" fill="#111">état final (bord épais) : plus aucune transition possible.</text>
  <rect x="35" y="664" width="50" height="16" rx="4" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="95" y="677" font-size="12" fill="#111">bord en tirets : état absent du code actuel, déduit ou à valider 🤔 avec le fondateur et la comptabilité.</text>
</svg>
